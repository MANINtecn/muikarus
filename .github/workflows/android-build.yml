name: Build MU Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Install Android Workload
      run: dotnet workload install android

    - name: Build Android Client
      run: dotnet publish Client_Android\MuAndroid\MuAndroid.csproj -f net9.0-android -c Release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MU-Ikarus-Android-APK
        path: Client_Android\MuAndroid\bin\Release\net9.0-android\**\*-Signed.apk

    - name: Publish APK to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Ikarus MU Mobile - Último APK"
        body: |
          🚀 **Build Automático do Ikarus MU Mobile**
          - **Commit:** ${{ github.sha }}
          - **Data:** ${{ github.event.head_commit.timestamp }}
          
          📱 Baixe o arquivo `.apk` assinado abaixo diretamente no seu celular e instale!
        draft: false
        prerelease: false
        files: Client_Android\MuAndroid\bin\Release\net9.0-android\**\*-Signed.apk

